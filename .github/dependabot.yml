# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategy: weekly cadence + aggressive grouping so minor/patch bumps arrive as
# a few batched PRs instead of dozens. Major bumps stay ungrouped so they get
# individual review. Patch/minor PRs are auto-merged by dependabot-automerge.yml
# once CI passes (requires branch protection to gate on checks).
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Seoul'
    # Let releases age before proposing them — avoids pulling brand-new
    # packages that fail pnpm's supply-chain (minimumReleaseAge) policy and
    # break `pnpm install --frozen-lockfile` in CI.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      # Framework-specific groups (kept from before) take precedence.
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      react-email:
        patterns:
          - '@react-email/*'
          - 'react-email'
      next:
        patterns:
          - 'next'
          - 'eslint-config-next'
      prisma:
        patterns:
          - '@prisma/client'
          - 'prisma'
      # Catch-all: batch the long tail of non-major updates.
      production-minor-patch:
        applies-to: version-updates
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-minor-patch:
        applies-to: version-updates
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns:
          - '*'
